version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
    - rowserrcheck
    - sqlclosecheck
  settings:
    depguard:
      # Dependency boundaries (ARCH-004, docs/ARCHITECTURE.md). depguard compares
      # an import with the nearest entry of each sorted list only, so a deny list
      # must not hold overlapping prefixes: every rule denies the one prefix
      # montra/backend/internal/ and allows (lax mode: the longer match wins)
      # what that layer may use.
      #
      #   domain/*    -> domain only (and no HTTP, database or transport libraries)
      #   platform/*  -> platform only
      #   apitypes    -> domain;  store/* -> nothing internal
      #   features    -> platform, domain, apitypes, store, their own subpackages
      #                  and the cross-feature edges listed per feature below
      #   app (composition root) is imported only by cmd/*, internal/testutil
      #   (test servers) and internal/seed (demo data through the real services,
      #   run by cmd/seed); nothing under internal imports cmd/*. Features may
      #   not import testutil or seed (the feature rules deny them).
      #
      # The feature edges are the ones that exist by design today (2026-11-13,
      # `go list` and the depends_on edges in docs/knowledge-graph/graph.json):
      # finance (ledger) and notifications are the shared services most features
      # use; analytics, reports and ai read across features. A new edge is a
      # design decision: add it to the feature's allow list in the same change.
      rules:
        domain-is-pure:
          list-mode: lax
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/danielgtaylor/huma/v2
              desc: domain packages must not depend on the transport layer
            - pkg: github.com/jackc/pgx/v5
              desc: domain packages must not depend on the database
            - pkg: montra/backend/internal/
              desc: domain packages import only other domain packages (no platform, store or feature packages)
            - pkg: net/http
              desc: domain packages must not depend on HTTP (spec §8)
          allow:
            - montra/backend/internal/domain
        platform-is-infrastructure:
          list-mode: lax
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: montra/backend/internal/
              desc: platform packages are infrastructure and must not import features, domain, store or app
          allow:
            - montra/backend/internal/platform
        apitypes-shared:
          list-mode: lax
          files:
            - "**/internal/apitypes/**"
          deny:
            - pkg: montra/backend/internal/
              desc: apitypes is shared by features and may import domain packages only
          allow:
            - montra/backend/internal/domain
        store-is-generated:
          list-mode: lax
          files:
            - "**/internal/store/**"
          deny:
            - pkg: montra/backend/internal/
              desc: sqlc-generated store code imports nothing internal
        wiring-in-cmd:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/app/**"
            - "!**/internal/testutil/**"
            - "!**/internal/seed/**"
          deny:
            - pkg: montra/backend/cmd
              desc: cmd/* holds the main packages; internal code never imports them
            - pkg: montra/backend/internal/app$
              desc: internal/app is the composition root, wired only from cmd/* (internal/testutil and internal/seed consume the services cmd builds)
        feature-admin:
          list-mode: lax
          files:
            - "**/internal/admin/**"
          deny:
            - pkg: montra/backend/internal/
              desc: "feature admin may import only shared packages (ARCH-004; add new edges deliberately in backend/.golangci.yml)"
          allow:
            - montra/backend/internal/admin
            - montra/backend/internal/apitypes
            - montra/backend/internal/domain
            - montra/backend/internal/platform
            - montra/backend/internal/store
        feature-ai:
          list-mode: lax
          files:
            - "**/internal/ai/**"
          deny:
            - pkg: montra/backend/internal/
              desc: "feature ai may import only shared packages and analytics, finance, receipts, subscriptions (ARCH-004; add new edges deliberately in backend/.golangci.yml)"
          allow:
            - montra/backend/internal/ai
            - montra/backend/internal/analytics
            - montra/backend/internal/apitypes
            - montra/backend/internal/domain
            - montra/backend/internal/finance
            - montra/backend/internal/platform
            - montra/backend/internal/receipts
            - montra/backend/internal/store
            - montra/backend/internal/subscriptions
        feature-analytics:
