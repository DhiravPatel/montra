# Strict static analysis for the Montra mobile app.
# `flutter analyze` must report zero issues before a change is merged.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Together these replace the old `implicit-dynamic: false`: no implicit
    # casts from dynamic, no inference falling back to dynamic, and no raw
    # generic types.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat the most consequential hints as errors.
    missing_required_param: error
    missing_return: error
    unawaited_futures: error
    unused_import: error
    dead_code: error
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated by `flutter gen-l10n` from the ARB files.
    - lib/app/l10n/generated/**

linter:
  rules:
    - always_declare_return_types
    - always_use_package_imports
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - avoid_type_to_string
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - prefer_void_to_null
    - test_types_in_equals
    - throw_in_finally
    - type_annotate_public_apis
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_build_context_synchronously
